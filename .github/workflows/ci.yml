name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Сборка и тесты (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: vocabulary
            source: vocabulary.cpp
          - project: tic-tac-toe
            source: tic_tac_toe.cpp
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить инструменты
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libunittest++-dev gcovr

      - name: Собрать приложение и тесты
        run: |
          make clean
          make CXXFLAGS="-std=c++11 -Wall -Wextra -Werror --coverage -Iinclude" tests main

      - name: Запустить тесты
        run: ./unit_tests

      - name: Проверить покрытие
        run: |
          gcovr --root . \
            --filter 'include/' \
            --filter 'src/${{ matrix.source }}' \
            --fail-under-line 90 \
            --print-summary \
            --xml coverage.xml

      - name: Сохранить отчёт покрытия
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.project }}
          path: ${{ matrix.project }}/coverage.xml

  static-analysis:
    name: Статический анализ (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [vocabulary, tic-tac-toe]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить компилятор и clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang-tidy

      - name: Проверить строгую компиляцию
        run: |
          for source in src/*.cpp; do
            g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror \
              -Iinclude -fsyntax-only "$source"
          done

      - name: Запустить clang-analyzer
        run: |
          for source in src/*.cpp; do
            clang-tidy --checks='-*,clang-analyzer-*' \
              --warnings-as-errors='*' "$source" -- -std=c++11 -Iinclude
          done

  docs:
    name: Документация Doxygen (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [vocabulary, tic-tac-toe]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Сгенерировать документацию
        run: make docs

      - name: Сохранить документацию
        uses: actions/upload-artifact@v4
        with:
          name: docs-${{ matrix.project }}
          path: ${{ matrix.project }}/docs/html

  package:
    name: Сборка артефактов
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Собрать релизные бинарники
        run: |
          mkdir -p dist/vocabulary dist/tic-tac-toe
          g++ -std=c++11 -O2 -Wall -Wextra -Werror -Ivocabulary/include \
            -static-libstdc++ -static-libgcc \
            -o dist/vocabulary/vocabulary \
            vocabulary/src/main.cpp vocabulary/src/vocabulary.cpp
          g++ -std=c++11 -O2 -Wall -Wextra -Werror -Itic-tac-toe/include \
            -static-libstdc++ -static-libgcc \
            -o dist/tic-tac-toe/tic_tac_toe \
            tic-tac-toe/src/main.cpp tic-tac-toe/src/tic_tac_toe.cpp
          cp README.md dist/vocabulary/README.md
          cp README.md dist/tic-tac-toe/README.md
          tar -czf dist/vocabulary-linux-x86_64.tar.gz -C dist/vocabulary .
          tar -czf dist/tic-tac-toe-linux-x86_64.tar.gz -C dist/tic-tac-toe .

      - name: Сохранить релизные архивы
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: dist/*.tar.gz

      - name: Опубликовать Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
